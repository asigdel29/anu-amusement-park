# Continuous integration.
#
# Contract: every pull request and every push to main runs the same gates that
# `npm run check` runs locally, plus the end-to-end suite. A green run means the
# tree typechecks, lints, passes unit and contract tests, builds, stays inside
# its shipped-byte budgets, and is navigable in three browser engines — including
# with JavaScript disabled.
#
# Why the gates are duplicated here rather than delegated to a single `npm run
# check`: a failing step should name what broke on the summary page without
# anyone opening a log.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Contrast report
        run: npm run contrast

      - name: Unit and contract tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Shipped-byte budgets
        run: npm run size

      # Installed after the build so a compile failure reports before spending
      # two minutes downloading browsers.
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
